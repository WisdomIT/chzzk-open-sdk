name: Release

# vX.Y.Z 태그 push에서만 발동 — 태그 없이 자동 배포되지 않는다.
#
# 인증: npm Trusted Publishing (GitHub Actions OIDC) — 토큰/시크릿 불필요.
# 사전 준비(1회): npmjs.com > chzzk-open-sdk > Settings > Trusted Publisher에
# GitHub Actions(WisdomIT/chzzk-open-sdk, release.yml) 등록.
# 절차는 docs/release.md 참조.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # OIDC 신원 증명 + provenance 서명

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing은 npm 11.5.1+ 필요 (Node 22 기본 npm은 10.x)
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 package.json 버전($PKG_VERSION)이 다릅니다."
            exit 1
          fi

      - name: Quality gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Inspect publish contents (log)
        run: npm publish --dry-run

      # OIDC 기반 무토큰 배포 — provenance는 trusted publishing에서 자동 생성
      - name: Publish to npm (trusted publishing)
        run: npm publish --access public
