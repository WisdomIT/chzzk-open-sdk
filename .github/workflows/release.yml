name: Release

# vX.Y.Z 태그 push에서만 발동 — 태그 없이 자동 배포되지 않는다.
# 사전 준비: 저장소 시크릿에 NPM_TOKEN(npm automation token) 등록.
# 절차는 docs/release.md 참조.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # npm provenance 서명용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 package.json 버전($PKG_VERSION)이 다릅니다."
            exit 1
          fi

      - name: Quality gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Inspect publish contents (log)
        run: npm publish --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
